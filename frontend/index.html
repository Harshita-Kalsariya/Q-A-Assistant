 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Document Q&amp;A Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>Document Q&amp;A Assistant</h1>

    <div class="card">
        <h2>1. Upload Document</h2>
        <p class="help-text">
            Supported files: PDF, DOCX, TXT, JPG, JPEG, PNG
        </p>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.docx,.txt,.jpg,.jpeg,.png"
        >

        <button id="uploadButton" type="button" onclick="uploadDocument()">
            Upload &amp; Index
        </button>

        <div id="uploadStatus" class="status" role="status" aria-live="polite"></div>
    </div>

    <div class="card">
        <h2>2. Ask Question</h2>

        <input
            type="text"
            id="questionInput"
            placeholder="Ask something from your document..."
        >

        <button id="askButton" type="button" onclick="askQuestion()">
            Ask Question
        </button>

        <div id="answerBox" class="answer-box" role="status" aria-live="polite">
            Upload a document first.
        </div>
    </div>
</div>

<script>
"use strict";

// Frontend aur backend same Render service par hain.
const API_URL = "";

const ALLOWED_EXTENSIONS = [
    "pdf", "docx", "txt", "jpg", "jpeg", "png"
];

function showStatus(message, type = "") {
    const status = document.getElementById("uploadStatus");
    status.className = "status " + type;
    status.textContent = message;
}

async function sendRequest(url, options) {
    let response;

    try {
        response = await fetch(url, options);
    } catch (error) {
        throw new Error(
            "Server se connection nahi ho raha. Internet check karein, page refresh karein aur Render logs dekhein."
        );
    }

    const text = await response.text();
    let data = {};

    try {
        data = text ? JSON.parse(text) : {};
    } catch {
        data = {};
    }

    if (!response.ok) {
        throw new Error(
            data.error ||
            data.message ||
            `Server error: HTTP ${response.status}`
        );
    }

    return data;
}

async function uploadDocument() {
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const file = fileInput.files[0];

    if (!file) {
        showStatus("Please select a file first.", "error");
        return;
    }

    const extension = file.name.split(".").pop().toLowerCase();

    if (!ALLOWED_EXTENSIONS.includes(extension)) {
        showStatus("Unsupported file type. Select PDF, DOCX, TXT, JPG, JPEG or PNG.", "error");
        return;
    }

    if (file.size === 0) {
        showStatus("The selected file is empty.", "error");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    uploadButton.disabled = true;
    uploadButton.textContent = "Processing...";
    showStatus("Uploading file and processing its content...", "loading");

    try {
        const data = await sendRequest(API_URL + "/upload", {
            method: "POST",
            body: formData
        });

        showStatus(
            data.message || "Upload completed successfully.",
            "success"
        );

        document.getElementById("answerBox").textContent =
            "Document processed. You can now ask a question.";

    } catch (error) {
        console.error("Upload error:", error);
        showStatus("Upload failed: " + error.message, "error");
    } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload & Index";
    }
}

async function askQuestion() {
    const questionInput = document.getElementById("questionInput");
    const answerBox = document.getElementById("answerBox");
    const askButton = document.getElementById("askButton");
    const question = questionInput.value.trim();

    if (!question) {
        answerBox.textContent = "Please enter a question.";
        return;
    }

    askButton.disabled = true;
    askButton.textContent = "Searching...";
    answerBox.textContent = "Searching your document...";

    try {
        const data = await sendRequest(API_URL + "/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question })
        });

        answerBox.textContent = data.answer || "No answer received.";

    } catch (error) {
        console.error("Question error:", error);
        answerBox.textContent = "Request failed: " + error.message;
    } finally {
        askButton.disabled = false;
        askButton.textContent = "Ask Question";
    }
}

document.getElementById("questionInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            askQuestion();
        }
    }
);
</script>

</body>
</html>
