
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Document Q&A Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>Document Q&amp;A Assistant</h1>

    <div class="card">
        <h2>1. Upload Document</h2>

        <p class="help-text">
            Supported files: PDF, DOCX, TXT, JPG, JPEG, PNG
            <br>
            Maximum file size: 10 MB
        </p>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.docx,.txt,.jpg,.jpeg,.png"
        >

        <button id="uploadButton" type="button">
            Upload &amp; Index
        </button>

        <div id="uploadStatus"
             class="status"
             role="status"
             aria-live="polite"></div>
    </div>

    <div class="card">
        <h2>2. Ask Question</h2>

        <input
            type="text"
            id="questionInput"
            placeholder="Ask something from your document..."
        >

        <button id="askButton" type="button">
            Ask Question
        </button>

        <div id="answerBox"
             class="answer-box"
             role="status"
             aria-live="polite">
            Upload a document first.
        </div>
    </div>
</div>

<script>
"use strict";

// Relative URLs ensure requests use the same origin as this page.
const API_URL = "";

const ALLOWED_EXTENSIONS = [
    "pdf", "docx", "txt", "jpg", "jpeg", "png"
];

const MAX_FILE_SIZE = 10 * 1024 * 1024;

function showStatus(message, type = "") {
    const status = document.getElementById("uploadStatus");
    status.className = "status " + type;
    status.textContent = message;
}

async function sendRequest(endpoint, options) {
    // Example: /upload or /ask
    const url = API_URL + endpoint;

    console.log("Request URL:", window.location.origin + url);
    console.log("Request method:", options.method || "GET");

    let response;

    try {
        response = await fetch(url, options);
    } catch (error) {
        console.error("Fetch failed:", error);

        throw new Error(
            "Browser server se connect nahi kar paaya. " +
            "Internet connection check karo. Browser error: " +
            (error.message || "Network error")
        );
    }

    console.log("HTTP status:", response.status);

    const responseText = await response.text();
    let data = {};

    try {
        data = responseText ? JSON.parse(responseText) : {};
    } catch (error) {
        console.error("Server response was not JSON.");
    }

    if (!response.ok) {
        throw new Error(
            data.error ||
            data.message ||
            "Server error: HTTP " + response.status
        );
    }

    return data;
}

// ======================================================
// UPLOAD DOCUMENT
// ======================================================

async function uploadDocument() {
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const file = fileInput.files[0];

    if (!file) {
        showStatus("Please select a file first.", "error");
        return;
    }

    const extension = file.name.split(".").pop().toLowerCase();

    if (!ALLOWED_EXTENSIONS.includes(extension)) {
        showStatus(
            "Unsupported file. Select PDF, DOCX, TXT, JPG or PNG.",
            "error"
        );
        return;
    }

    if (file.size === 0) {
        showStatus("The selected file is empty.", "error");
        return;
    }

    if (file.size > MAX_FILE_SIZE) {
        showStatus(
            "File is larger than 10 MB. Select a smaller file.",
            "error"
        );
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";

    showStatus(
        "Uploading file (" + (file.size / 1024).toFixed(1) + " KB)...",
        "loading"
    );

    try {
        const data = await sendRequest("/upload", {
            method: "POST",
            body: formData
        });

        if (data.success !== true) {
            throw new Error(data.error || "Upload was not successful.");
        }

        showStatus(
            data.message || "Document processed successfully.",
            "success"
        );

        document.getElementById("answerBox").textContent =
            "Document processed. You can now ask a question.";

    } catch (error) {
        console.error("Upload error:", error);

        showStatus(
            "Upload failed: " + error.message,
            "error"
        );
    } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload & Index";
    }
}

// ======================================================
// ASK QUESTION
// ======================================================

async function askQuestion() {
    const questionInput = document.getElementById("questionInput");
    const answerBox = document.getElementById("answerBox");
    const askButton = document.getElementById("askButton");

    const question = questionInput.value.trim();

    if (!question) {
        answerBox.textContent = "Please enter a question.";
        return;
    }

    askButton.disabled = true;
    askButton.textContent = "Searching...";
    answerBox.textContent = "Searching your document...";

    try {
        const data = await sendRequest("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        if (data.success !== true) {
            throw new Error(data.error || "Could not answer the question.");
        }

        answerBox.textContent = data.answer || "No answer received.";

    } catch (error) {
        console.error("Question error:", error);

        answerBox.textContent =
            "Request failed: " + error.message;

    } finally {
        askButton.disabled = false;
        askButton.textContent = "Ask Question";
    }
}

// ======================================================
// BUTTON EVENTS
// ======================================================

document.getElementById("uploadButton").addEventListener(
    "click",
    uploadDocument
);

document.getElementById("askButton").addEventListener(
    "click",
    askQuestion
);

document.getElementById("questionInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            askQuestion();
        }
    }
);
</script>

</body>
</html>
