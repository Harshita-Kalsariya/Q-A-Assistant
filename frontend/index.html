
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Document Q&A Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>Document Q&A Assistant</h1>

    <div class="card">
        <h2>1. Upload Document</h2>
        <p class="help-text">
            Supported files: PDF, DOCX, TXT, JPG, JPEG, PNG
        </p>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.docx,.txt,.jpg,.jpeg,.png"
        >

        <button id="uploadButton" type="button">
            Upload &amp; Index
        </button>

        <div id="uploadStatus" class="status"
             role="status" aria-live="polite"></div>
    </div>

    <div class="card">
        <h2>2. Ask Question</h2>

        <input
            type="text"
            id="questionInput"
            placeholder="Ask something from your document..."
        >

        <button id="askButton" type="button">
            Ask Question
        </button>

        <div id="answerBox" class="answer-box"
             role="status" aria-live="polite">
            Upload a document first.
        </div>
    </div>
</div>

<script>
"use strict";

const API_URL = window.location.origin;

const ALLOWED_EXTENSIONS = [
    "pdf", "docx", "txt", "jpg", "jpeg", "png"
];

function showStatus(message, type = "") {
    const status = document.getElementById("uploadStatus");
    status.className = "status " + type;
    status.textContent = message;
}

async function sendRequest(endpoint, options) {
    const url = API_URL + endpoint;

    console.log("Sending request:", url);

    let response;

    try {
        response = await fetch(url, options);
    } catch (error) {
        console.error("Network/fetch error:", error);

        throw new Error(
            "Request server tak nahi pahunchi. Internet check karein. " +
            "Original error: " + (error.message || "Unknown network error")
        );
    }

    console.log("Server response:", response.status, endpoint);

    const responseText = await response.text();
    let data = {};

    try {
        data = responseText ? JSON.parse(responseText) : {};
    } catch (error) {
        console.error("Invalid server response:", responseText);
    }

    if (!response.ok) {
        throw new Error(
            data.error ||
            data.message ||
            "Server ne HTTP " + response.status + " error diya."
        );
    }

    return data;
}

async function uploadDocument() {
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const file = fileInput.files[0];

    if (!file) {
        showStatus("Please select a file first.", "error");
        return;
    }

    const extension = file.name.split(".").pop().toLowerCase();

    if (!ALLOWED_EXTENSIONS.includes(extension)) {
        showStatus("Unsupported file type.", "error");
        return;
    }

    if (file.size === 0) {
        showStatus("The selected file is empty.", "error");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";
    showStatus(
        "Uploading " + file.name + " (" +
        (file.size / 1024).toFixed(1) + " KB)...",
        "loading"
    );

    try {
        const data = await sendRequest("/upload", {
            method: "POST",
            body: formData
        });

        showStatus(
            data.message || "File processed successfully.",
            "success"
        );

        document.getElementById("answerBox").textContent =
            "Document processed. You can now ask a question.";

    } catch (error) {
        console.error("Upload failed:", error);
        showStatus("Upload failed: " + error.message, "error");
    } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload & Index";
    }
}

async function askQuestion() {
    const questionInput = document.getElementById("questionInput");
    const answerBox = document.getElementById("answerBox");
    const askButton = document.getElementById("askButton");
    const question = questionInput.value.trim();

    if (!question) {
        answerBox.textContent = "Please enter a question.";
        return;
    }

    askButton.disabled = true;
    askButton.textContent = "Searching...";
    answerBox.textContent = "Searching your document...";

    try {
        const data = await sendRequest("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        answerBox.textContent = data.answer || "No answer received.";

    } catch (error) {
        console.error("Question failed:", error);
        answerBox.textContent = "Request failed: " + error.message;
    } finally {
        askButton.disabled = false;
        askButton.textContent = "Ask Question";
    }
}

document.getElementById("uploadButton").addEventListener(
    "click", uploadDocument
);

document.getElementById("askButton").addEventListener(
    "click", askQuestion
);

document.getElementById("questionInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            askQuestion();
        }
    }
);
</script>

</body>
</html>
